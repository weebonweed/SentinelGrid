spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelgrid
    username: sentinel
    password: sentinel_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: localhost
      port: 6379
      password: redis_secret
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

logging:
  level:
    com.sentinelgrid: DEBUG
    org.springframework.data.redis: INFO
